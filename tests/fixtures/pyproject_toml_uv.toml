[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "example-uv-pkg"
version = "0.3.0"
description = "A uv-managed package"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8.0.0"]
